name: Deploy to GitHub Pages

on:
  # Deploy from main once merged, and from the active work branch for now
  # (this app hasn't been merged yet) so there's always a reviewable preview.
  push:
    branches: [main, claude/quran-hifz-pwa-5uuo8f]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Classic branch-based Pages deployment: pushes dist/ to a gh-pages branch
# with the default GITHUB_TOKEN. Deliberately not using actions/deploy-pages
# (the environment/OIDC-based method) — that requires the auto-created
# "github-pages" environment's branch-protection rule to allow this branch,
# which isn't editable from this account/repo's Settings UI. This approach
# only needs `contents: write` and has no such gate.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
